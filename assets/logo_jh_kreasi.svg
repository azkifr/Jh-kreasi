<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring: Pure White / Ivory -->
  <circle cx="150" cy="150" r="124" fill="none" stroke="#F9F9F6" stroke-width="2.2" stroke-opacity="0.95" />
  
  <!-- Inner Ring: Warm Luxury Gold -->
  <circle cx="150" cy="150" r="114" fill="none" stroke="#D4AF37" stroke-width="1.8" stroke-opacity="0.9" />
  
  <!-- Center Monogram "JH" -->
  <text 
    x="150" 
    y="168" 
    font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif" 
    font-size="66" 
    font-weight="300" 
    letter-spacing="6" 
    fill="#F9F9F6" 
    text-anchor="middle">JH</text>
</svg>
